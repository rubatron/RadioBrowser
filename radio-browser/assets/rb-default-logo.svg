<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <rect width="240" height="240" rx="12" fill="#1a1a1a"/>
  <!-- Radio body -->
  <rect x="50" y="95" width="140" height="100" rx="10" fill="none" stroke="#c55a11" stroke-width="5"/>
  <!-- Speaker circle -->
  <circle cx="155" cy="150" r="28" fill="none" stroke="#c55a11" stroke-width="4"/>
  <circle cx="155" cy="150" r="12" fill="#c55a11"/>
  <!-- Tuner line -->
  <line x1="72" y1="120" x2="118" y2="120" stroke="#c55a11" stroke-width="3" stroke-linecap="round"/>
  <circle cx="98" cy="120" r="5" fill="#c55a11"/>
  <!-- Display lines -->
  <line x1="72" y1="135" x2="118" y2="135" stroke="#c55a11" stroke-width="2" opacity="0.5"/>
  <line x1="72" y1="145" x2="105" y2="145" stroke="#c55a11" stroke-width="2" opacity="0.3"/>
  <!-- Antenna -->
  <line x1="80" y1="95" x2="60" y2="50" stroke="#c55a11" stroke-width="4" stroke-linecap="round"/>
  <circle cx="60" cy="48" r="4" fill="#c55a11"/>
  <!-- Signal waves -->
  <path d="M 55 38 Q 45 28 55 18" fill="none" stroke="#c55a11" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
  <path d="M 50 42 Q 35 27 50 12" fill="none" stroke="#c55a11" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
</svg>
